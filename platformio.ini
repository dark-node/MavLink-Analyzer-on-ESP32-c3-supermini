; MavLink Analyzer — PlatformIO (reference only)
;
; This PUBLIC repository does NOT build complete firmware:
;   - core src/*.cpp are stubs
;   - lib/mavlink/generated/ and crc_common_table.h are not published
;
; Full source is maintained in the owner's private project.

[platformio]
default_envs = release

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    esphome/ESPAsyncWebServer-esphome @ 3.4.0
    esphome/AsyncTCP-esphome @ 2.1.4
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBRIDGE_SIM_TRACE=0
    -Ilib/mavlink
    -DMAVLINK_COMM_NUM_BUFFERS=0

[env:release]
build_flags =
    ${env.build_flags}
    -DBRIDGE_SIMULATION=0
    -DFIRMWARE_VERSION=\"1.0.1\"

[env:dev]
build_flags =
    ${env.build_flags}
    -DBRIDGE_SIMULATION=1

[env:esp32-c3-devkitm-1]
extends = env:dev
